services:

  # Broker de mensagens, usado para a comunicação entre serviços
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "2201:5672"   # porta das mensagens
      - "2202:15672"  # consola web (guest/guest)

  # Base de dados do serviço de utilizadores
  users-db:
    image: postgres:16
    environment:
      POSTGRES_USER: users
      POSTGRES_PASSWORD: users
      POSTGRES_DB: usersdb
    ports:
      - "2301:5432"
    volumes:
      - users-data:/var/lib/postgresql/data  # guarda os dados fora do contentor
    # Verifica se a base de dados já está pronta
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users -d usersdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Serviço de utilizadores (API em FastAPI)
  users-service:
    build: ./services/users-service
    environment:
      # Usa o nome do serviço da base de dados e a porta interna
      DATABASE_URL: postgresql://users:users@users-db:5432/usersdb
    ports:
      - "2101:8000"  # porta do PC : porta do contentor
    # Só arranca depois da base de dados estar pronta
    depends_on:
      users-db:
        condition: service_healthy

  # Base de dados do serviço de incidentes
  incidents-db:
    image: postgres:16
    environment:
      POSTGRES_USER: incidents
      POSTGRES_PASSWORD: incidents
      POSTGRES_DB: incidentsdb
    ports:
      - "2302:5432"
    volumes:
      - incidents-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidents -d incidentsdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Serviço de incidentes (API em FastAPI)
  incidents-service:
    build: ./services/incidents-service
    environment:
      DATABASE_URL: postgresql://incidents:incidents@incidents-db:5432/incidentsdb
      USERS_SERVICE_URL: http://users-service:8000
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
    ports:
      - "2102:8000"
    # Só arranca depois da base de dados estar pronta
    depends_on:
      incidents-db:
        condition: service_healthy

  # Base de dados do serviço de notificações
  notifications-db:
    image: postgres:16
    environment:
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: notifications
      POSTGRES_DB: notificationsdb
    ports:
      - "2303:5432"
    volumes:
      - notifications-data:/var/lib/postgresql/data
    # Verifica se a base de dados já está pronta
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifications -d notificationsdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Serviço de notificações (API e consumidor de eventos)
  notifications-service:
    build: ./services/notifications-service
    environment:
      DATABASE_URL: postgresql://notifications:notifications@notifications-db:5432/notificationsdb
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      # Escreve os logs de imediato, sem esperar
      PYTHONUNBUFFERED: "1"
    ports:
      - "2103:8000"
    depends_on:
      notifications-db:
        condition: service_healthy
      rabbitmq:
        condition: service_started

# Volumes onde ficam guardados os dados das bases de dados
volumes:
  users-data:
  incidents-data:
  notifications-data: